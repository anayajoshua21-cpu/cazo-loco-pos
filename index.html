<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Cazo Loco - POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --brown:#6b3a1f; --brown-dark:#4a2712; --red:#e0392b; --red-dark:#b52d21; --cream:#fff6ea; --white:#ffffff;
  --text:#2b1b12; --ok:#2e7d32; --gray:#8a7b6c; --gold:#e8a13a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --cream:#1c130c; --white:#2a1d14; --text:#f6ead9; --gray:#c2ab93;}
}
:root[data-theme="dark"]{ --cream:#1c130c; --white:#2a1d14; --text:#f6ead9; --gray:#c2ab93;}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:'Poppins',-apple-system,Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--text);
  font-size:17px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3{font-family:'Baloo 2',-apple-system,sans-serif}
header{background:linear-gradient(135deg,var(--brown) 0%,var(--brown-dark) 100%);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 3px 12px rgba(0,0,0,.25)}
header .brand{display:flex;align-items:center;gap:10px}
header .brand img{height:42px;width:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
header h1{font-size:1.35rem;margin:0;letter-spacing:.3px}
header .sub{font-size:.85rem;opacity:.9}
button{cursor:pointer;border:none;border-radius:12px;padding:13px 18px;font-size:1.02rem;font-weight:700;font-family:'Poppins',sans-serif;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s ease, filter .15s ease;}
button:active{transform:scale(.93)}
.btn-primary{background:linear-gradient(135deg,var(--red) 0%,var(--red-dark) 100%);color:#fff;box-shadow:0 4px 14px rgba(224,57,43,.35)}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn-outline{background:rgba(255,255,255,.12);border:2px solid #fff;color:#fff}
.btn-outline:hover{background:rgba(255,255,255,.22)}
.btn-ghost{background:var(--white);color:var(--brown);border:2px solid #e5d4c0}
.btn-ghost:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.08)}
main{max-width:920px;margin:0 auto;padding:18px;overflow-x:auto}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:var(--white);border-radius:16px;padding:18px;box-shadow:0 3px 10px rgba(0,0,0,.09);transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(0,0,0,.14)}
.table-card{text-align:center;font-weight:800;font-size:1.2rem;cursor:pointer;font-family:'Baloo 2',sans-serif}
.status-libre{border:3px solid var(--ok)}
.status-ocupada{border:3px solid var(--red);animation:pulseOcupada 2s ease-in-out infinite}
.status-cobrar{border:3px solid var(--gold)}
.togo-card{border:3px dashed var(--brown)}
@keyframes pulseOcupada{0%,100%{box-shadow:0 3px 10px rgba(224,57,43,.15)}50%{box-shadow:0 3px 18px rgba(224,57,43,.4)}}
.tag{display:inline-block;font-size:.78rem;padding:3px 10px;border-radius:20px;margin-top:7px;font-weight:700}
.tag-libre{background:#e6f4ea;color:var(--ok)}
.tag-ocupada{background:#fdecea;color:var(--red)}
.tag-cobrar{background:#fff6dd;color:#8a6d00}
.cat-title{color:var(--brown);border-bottom:3px solid var(--red);padding-bottom:5px;margin-top:26px;font-family:'Baloo 2',sans-serif;font-size:1.15rem;font-weight:700}
.item-row{display:flex;justify-content:space-between;align-items:center;background:var(--white);padding:12px 14px;border-radius:12px;margin-bottom:9px;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.item-row .price{color:var(--gray);font-size:.88rem;font-weight:600}
.order-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--gray);font-size:1.02rem}
input,select,textarea{font-size:1.02rem;padding:11px;border-radius:10px;border:2px solid #e5d4c0;width:100%;font-family:'Poppins',sans-serif;background:var(--white);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.login-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));max-width:640px;margin:30px auto}
.role-card{background:var(--white);border-radius:20px;padding:28px 20px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.12);cursor:pointer;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease}
.role-card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 14px 28px rgba(0,0,0,.18)}
.role-card:active{transform:scale(.96)}
.role-card .emoji{font-size:2.6rem;display:block;margin-bottom:6px}
.role-card h3{color:var(--brown);margin:6px 0 14px;font-size:1.25rem}
.total{font-size:1.6rem;font-weight:800;color:var(--red);text-align:right;margin-top:12px;font-family:'Baloo 2',sans-serif}
.flex{display:flex;gap:10px;flex-wrap:wrap}
.small{font-size:.85rem;color:var(--gray)}
.sync-warn{background:var(--red);color:#fff;padding:11px 16px;text-align:center;font-weight:700;font-size:.92rem}
.status-strip{padding:5px 10px;text-align:center;font-size:.74rem}
.status-ok{background:#173a1f;color:#c9f2d1}
.status-bad{background:#3a1717;color:#f2c9c9}
.logo-hero{display:block;margin:8px auto 4px;height:150px;width:auto;animation:logoBounce 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 16px rgba(0,0,0,.2))}
@keyframes logoBounce{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
.hero-title{text-align:center;color:var(--brown);font-size:1rem;margin:0 0 18px;font-weight:600;letter-spacing:.4px}
@keyframes viewIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.view-enter{animation:viewIn .4s cubic-bezier(.22,1,.36,1)}
@keyframes popIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.pop{animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
.ticket-wrap{background:var(--white);border-radius:18px;padding:26px;max-width:420px;margin:20px auto;box-shadow:0 8px 24px rgba(0,0,0,.15);
  font-family:'Poppins',monospace;position:relative;overflow:hidden}
.ticket-wrap::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,var(--red) 0 10px,transparent 10px 20px)}
.ticket-head{text-align:center;margin-bottom:14px}
.ticket-head img{height:70px}
.ticket-total{font-size:2rem;text-align:center;color:var(--red);font-weight:800;margin:14px 0;font-family:'Baloo 2',sans-serif}
#print-area{display:none}
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:absolute;top:0;left:0;width:100%;padding:10px;display:block}
}
</style>
</head>

let STATE=defaultState(), session=null, view="login", cart=[], activeTable=null, lastSale=null;
let fsDoc=null, synced=false, statusMsg="Conectando...";

function firebaseReady(){
 return firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("PEGA_AQUI")===-1;
}

async function boot(){
 if(!firebaseReady()){
  statusMsg="⚠️ Firebase no está configurado todavía. Trabajando solo en este dispositivo, sin compartir.";
  synced=false; render(); return;
 }
 try{
  firebase.initializeApp(firebaseConfig);
  const dbFs=firebase.firestore();
  fsDoc=dbFs.collection("cazoloco").doc("main");
  const snap=await fsDoc.get();
  if(snap.exists){ STATE=snap.data(); }
  else { await fsDoc.set(STATE); }
  fsDoc.onSnapshot(s=>{
   if(s&&s.exists){ STATE=s.data(); render(); }
  }, err=>{
   synced=false; statusMsg="❌ Error de sincronización: "+err.message; render();
  });
  synced=true; statusMsg="Sincronizado ✅";
 }catch(e){
  synced=false; statusMsg="❌ No se pudo conectar: "+(e&&e.message?e.message:e);
 }
 render();
}
async function save(){
 if(fsDoc){
  try{ await fsDoc.set(STATE); statusMsg="Sincronizado ✅"; synced=true; }
  catch(e){ statusMsg="❌ Error al guardar: "+(e&&e.message?e.message:e); synced=false; }
 }
 render();
}
function fmt(n){return "$"+Number(n).toFixed(0)}

function statusStrip(){
 return `<div class="status-strip ${synced?"status-ok":"status-bad"}">${statusMsg}</div>`;
}
function render(){
 const app=document.getElementById("app");
 if(view==="login"){ app.innerHTML=statusStrip()+renderLogin(); return; }
 const body = view==="mesas"?renderMesas():
  view==="orden"?renderOrden():
  view==="cocina"?renderCocina():
  view==="caja"?renderCaja():
  view==="ventaFinal"?renderVentaFinal():
  view==="admin"?renderAdmin():"";
 app.innerHTML = statusStrip()+`<header><div class="brand"><img src="${LOGO}" alt="Cazo Loco"><div><h1>Cazo Loco</h1><div class="sub">${session.name}</div></div></div>
  <button class="btn-outline" onclick="logout()">Salir</button></header>
  ${synced?"":'<div class="sync-warn">⚠️ SIN SINCRONIZAR — lo que hagas aquí no se verá en otros aparatos hasta que se resuelva la conexión.</div>'}
  <main class="view-enter">${navBar()}${body}</main>`;
}
function navBar(){
 let tabs=[];
 if(session.role==="mesero") tabs=[["mesas","🍽️ Mesas"]];
 if(session.role==="cocinero") tabs=[["cocina","🔥 Cocina"]];
 if(session.role==="cajero") tabs=[["mesas","🍽️ Mesas"],["caja","💵 Caja"]];
 if(session.role==="admin") tabs=[["mesas","🍽️ Mesas"],["cocina","🔥 Cocina"],["caja","💵 Caja"],["admin","⚙️ Panel"]];
 return `<div class="flex" style="margin-bottom:18px">`+tabs.map(t=>`<button class="${view===t[0]?'btn-primary':'btn-ghost'}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")+`</div>`;
}
function go(v){ view=v; render(); }
function logout(){ session=null; view="login"; render(); }

function renderLogin(){
 return `<main class="view-enter">
 <img src="${LOGO}" class="logo-hero pop" alt="Cazo Loco">
 <p class="hero-title">🌮 Carnitas con sabor — Punto de Venta</p>
 ${synced?"":'<div class="sync-warn" style="border-radius:12px;margin-bottom:10px">⚠️ Este dispositivo NO está sincronizado.</div>'}
 <p class="small" style="text-align:center">Toca tu rol para entrar</p><div class="login-grid">
  ${USERS.map(u=>`<div class="role-card" onclick="doLogin('${u.role}')">
   <span class="emoji">${u.emoji}</span>
   <h3>${u.name}</h3>
   <button class="btn-primary" style="width:100%">Entrar</button>
  </div>`).join("")}
 </div></main>`;
}
function doLogin(role){
 session=USERS.find(x=>x.role===role);
 view=(role==="cocinero"?"cocina":"mesas"); render();
}

function tableLabel(t){ return STATE.tables[t] ? "Mesa "+t : "Para llevar"; }
function pendingTakeout(){
 const map={};
 Object.values(STATE.orders).forEach(o=>{
  if(!STATE.tables[o.table] && o.status!=="entregada"){
   if(!map[o.table]) map[o.table]={table:o.table, ts:o.ts, total:0, count:0};
   o.items.forEach(it=>{map[o.table].total+=it.p*it.qty; map[o.table].count+=it.qty;});
  }
 });
 return Object.values(map).sort((a,b)=>a.ts-b.ts);
}
function renderMesas(){
 let h=`<h2 style="color:var(--brown)">🍽️ Mesas</h2><div class="grid">`;
 [1,2,3].forEach(id=>{
  const t=STATE.tables[id];
  h+=`<div class="card table-card status-${t.status}" onclick="openTable(${id})">
   Mesa ${id}<div class="tag tag-${t.status}">${t.status.toUpperCase()}</div></div>`;
 });
 h+="</div>";
 h+=`<div class="cat-title">🥡 Para llevar</div>`;
 if(session.role==="mesero"||session.role==="admin"){
  h+=`<button class="btn-primary" onclick="newTakeout()">+ Nueva orden para llevar</button>`;
 }
 const tk=pendingTakeout();
 if(tk.length===0) h+=`<p class="small">Sin pedidos para llevar pendientes</p>`;
 h+=`<div class="grid" style="margin-top:10px">`;
 tk.forEach(o=>{
  h+=`<div class="card table-card status-ocupada" onclick="openPseudo('${o.table}')">
   🥡<div class="small">${o.count} productos</div><div class="tag tag-ocupada">${fmt(o.total)}</div></div>`;
 });
 h+="</div>";
 return h;
}
function openTable(id){
 activeTable=id;
 const t=STATE.tables[id];
 if(t.status==="libre"){ cart=[]; view="orden"; render(); return; }
 if(t.status==="ocupada"){
  if(session.role==="cajero"||session.role==="admin"){ view="caja"; render(); }
  else { cart=[]; view="orden"; render(); }
 }
}
function newTakeout(){
 activeTable="TL"+Date.now().toString().slice(-6);
 cart=[]; view="orden"; render();
}
function openPseudo(id){
 activeTable=id;
 if(session.role==="cajero"||session.role==="admin"){ view="caja"; }
 else { cart=[]; view="orden"; }
 render();
}

function renderOrden(){
 let h=`<button class="btn-ghost" onclick="go('mesas')">← Mesas</button><h2 style="color:var(--brown)">${tableLabel(activeTable)} — Orden</h2>`;
 MENU.forEach(c=>{
  h+=`<div class="cat-title">${c.cat}</div>`;
  c.items.forEach((it,i)=>{
   h+=`<div class="item-row"><div>${it.n}<div class="price">${fmt(it.p)}</div></div>
   <button class="btn-ghost" onclick="addItem('${c.cat}',${i})">+ Agregar</button></div>`;
  });
 });
 h+=`<div class="cat-title">🧮 Monto personalizado (para carnitas por peso: $120, $170, $200...)</div>
 <div class="item-row">
  <input type="number" id="customPrice" placeholder="Precio, ej. 120" style="max-width:130px">
  <input type="text" id="customDesc" placeholder="Descripción (ej. Carnitas al gusto)">
  <button class="btn-ghost" onclick="addCustomItem()">+ Agregar</button>
 </div>`;
 h+=`<div class="cat-title">📝 Nota</div><textarea id="note" placeholder="Tipo de carnitas, sin cebolla, salsas..."></textarea>`;
 h+=`<div class="cat-title">🧾 Comanda actual</div>`;
 if(cart.length===0) h+=`<p class="small">Sin productos aún</p>`;
 let total=0;
 cart.forEach((it,i)=>{ total+=it.p*it.qty;
  h+=`<div class="order-line pop"><span>${it.qty}x ${it.n}</span><span>${fmt(it.p*it.qty)} <button class="btn-ghost" onclick="rmItem(${i})">✕</button></span></div>`;
 });
 h+=`<div class="total">Total: ${fmt(total)}</div>
 <button class="btn-primary" style="width:100%;margin-top:10px" onclick="sendOrder()">🔥 Enviar a cocina</button>`;
 return h;
}
function addItem(cat,i){
 const it=MENU.find(c=>c.cat===cat).items[i];
 const ex=cart.find(x=>x.n===it.n);
 if(ex) ex.qty++; else cart.push({n:it.n,p:it.p,qty:1});
 render();
}
function rmItem(i){ cart.splice(i,1); render(); }
function addCustomItem(){
 const price=Number(document.getElementById("customPrice").value);
 let desc=document.getElementById("customDesc").value.trim();
 if(!price||price<=0){ alert("Escribe un precio válido"); return; }
 if(!desc) desc="Carnitas al gusto";
 cart.push({n:desc+" ("+fmt(price)+")",p:price,qty:1});
 render();
}
async function sendOrder(){
 if(cart.length===0){ alert("Agrega al menos un producto"); return; }
 const note=document.getElementById("note").value;
 const id="o"+Date.now();
 STATE.orders[id]={id,table:activeTable,items:cart,note,status:"pendiente",employee:session.name,ts:Date.now()};
 STATE.tables[activeTable]={status:"ocupada"};
 cart=[];
 await save();
 view="mesas"; render();
}

function renderCocina(){
 let h=`<h2 style="color:var(--brown)">🔥 Comandas de cocina</h2>`;
 const pend=Object.values(STATE.orders).filter(o=>o.status!=="lista"&&o.status!=="entregada").sort((a,b)=>a.ts-b.ts);
 if(pend.length===0) h+=`<p class="small">No hay órdenes pendientes 🎉</p>`;
 pend.forEach(o=>{
  h+=`<div class="card pop" style="margin-bottom:12px"><b>${tableLabel(o.table)}</b> · ${new Date(o.ts).toLocaleTimeString()}<br>`;
  o.items.forEach(it=>h+=`<div class="order-line"><span>${it.qty}x ${it.n}</span></div>`);
  if(o.note) h+=`<p class="small">📝 ${o.note}</p>`;
  h+=`<button class="btn-primary" onclick="markReady('${o.id}')">✅ Marcar lista</button></div>`;
 });
 return h;
}
async function markReady(id){ STATE.orders[id].status="lista"; await save(); }

function renderCaja(){
 let h=`<button class="btn-ghost" onclick="go('mesas')">← Mesas</button><h2 style="color:var(--brown)">💵 Caja — ${activeTable?tableLabel(activeTable):""}</h2>`;
 if(!activeTable){ h+=`<p class="small">Selecciona una mesa ocupada, o un pedido para llevar, desde "Mesas" para cobrar.</p>`; return h; }
 const ords=Object.values(STATE.orders).filter(o=>o.table===activeTable&&o.status!=="entregada");
 let total=0, allItems=[];
 ords.forEach(o=>o.items.forEach(it=>{ total+=it.p*it.qty; allItems.push(it); }));
 allItems.forEach(it=>h+=`<div class="order-line"><span>${it.qty}x ${it.n}</span><span>${fmt(it.p*it.qty)}</span></div>`);
 h+=`<div class="total">Total: ${fmt(total)}</div>`;
 h+=`<div class="cat-title">Dividir cuenta entre</div><input type="number" id="split" min="1" value="1" style="max-width:100px">`;
 h+=`<div class="cat-title">Método de pago</div>
 <select id="pay"><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option><option value="mixto">Mixto</option></select>`;
 h+=`<button class="btn-primary" style="width:100%;margin-top:14px" onclick="closeTable(${total})">✅ Cobrar y cerrar mesa</button>`;
 return h;
}
async function closeTable(total){
 const pay=document.getElementById("pay").value;
 const split=Number(document.getElementById("split").value)||1;
 const ords=Object.values(STATE.orders).filter(o=>o.table===activeTable&&o.status!=="entregada");
 const items=[]; ords.forEach(o=>items.push(...o.items));
 const sale={id:"s"+Date.now(),table:activeTable,items,total,pay,split,employee:session.name,ts:Date.now()};
 STATE.sales.push(sale);
 ords.forEach(o=>o.status="entregada");
 if(STATE.tables[activeTable]) STATE.tables[activeTable]={status:"libre"};
 await save();
 lastSale=sale; activeTable=null; view="ventaFinal"; render();
}

function renderVentaFinal(){
 const sale=lastSale;
 if(!sale) return `<p class="small">No hay ninguna venta reciente.</p><button class="btn-ghost" onclick="go('mesas')">← Mesas</button>`;
 let h=`<h2 style="color:var(--brown)">✅ Venta final</h2>`;
 h+=`<div class="ticket-wrap pop">
  <div class="ticket-head"><img src="${LOGO}"><div class="small">${tableLabel(sale.table)} · ${new Date(sale.ts).toLocaleString()}</div></div>`;
 sale.items.forEach(it=>h+=`<div class="order-line"><span>${it.qty}x ${it.n}</span><span>${fmt(it.p*it.qty)}</span></div>`);
 h+=`<div class="ticket-total">${fmt(sale.total)}</div>`;
 if(sale.split>1) h+=`<p class="small" style="text-align:center">Dividido en ${sale.split}: ${fmt(sale.total/sale.split)} c/u</p>`;
 h+=`<p class="small" style="text-align:center">Pago: ${sale.pay} · Atendió: ${sale.employee}</p>
 </div>`;
 h+=`<div class="flex" style="justify-content:center;margin-top:16px">
  <button class="btn-primary" onclick="doPrint()">🖨️ Imprimir ticket</button>
  <button class="btn-ghost" onclick="go('mesas')">✅ Listo, volver a Mesas</button>
 </div>`;
 return h;
}
function doPrint(){
 const sale=lastSale; if(!sale) return;
 let h=`<h3>Cazo Loco — Carnitas con sabor</h3><p>${tableLabel(sale.table)} · ${new Date(sale.ts).toLocaleString()}</p><hr>`;
 sale.items.forEach(it=>h+=`<div>${it.qty}x ${it.n} — ${fmt(it.p*it.qty)}</div>`);
 h+=`<hr><b>Total: ${fmt(sale.total)}</b>`;
 if(sale.split>1) h+=`<p>Dividido en ${sale.split}: ${fmt(sale.total/sale.split)} c/u</p>`;
 h+=`<p>Pago: ${sale.pay}</p><p>Atendió: ${sale.employee}</p>`;
 document.getElementById("print-area").innerHTML=h;
 window.print();
}

function renderAdmin(){
 const now=Date.now(), day=86400000;
 const today=STATE.sales.filter(s=>now-s.ts<day);
 const week=STATE.sales.filter(s=>now-s.ts<7*day);
 const month=STATE.sales.filter(s=>now-s.ts<30*day);
 const sum=arr=>arr.reduce((a,s)=>a+s.total,0);
 let h=`<h2 style="color:var(--brown)">⚙️ Panel de administrador</h2>`;
 h+=`<div class="grid">
  <div class="card"><b>Hoy</b><div class="total">${fmt(sum(today))}</div><span class="small">${today.length} ventas</span></div>
  <div class="card"><b>Semana</b><div class="total">${fmt(sum(week))}</div><span class="small">${week.length} ventas</span></div>
  <div class="card"><b>Mes</b><div class="total">${fmt(sum(month))}</div><span class="small">${month.length} ventas</span></div>
 </div>`;
 h+=`<div class="cat-title">🧾 Ventas recientes</div>`;
 const recent=[...STATE.sales].sort((a,b)=>b.ts-a.ts).slice(0,8);
 if(recent.length===0) h+=`<p class="small">Aún no hay ventas</p>`;
 recent.forEach(s=>{
  h+=`<div class="item-row"><div>${tableLabel(s.table)} · ${new Date(s.ts).toLocaleTimeString()}<div class="small">${fmt(s.total)} · ${s.pay}</div></div>
   <button class="btn-ghost" onclick="reprint('${s.id}')">🖨️ Reimprimir</button></div>`;
 });
 h+=`<div class="cat-title">📦 Inventario</div>`;
 Object.entries(STATE.inventory).forEach(([k,v])=>{
  const low=v.stock<=v.min;
  h+=`<div class="item-row" style="${low?'border:2px solid var(--red)':''}">
   <div>${v.name} ${low?'⚠️ Bajo':''}</div>
   <div class="flex"><input type="number" id="inv-${k}" value="${v.stock}" style="width:70px">
   <button class="btn-ghost" onclick="updInv('${k}')">Actualizar</button></div></div>`;
 });
 h+=`<div class="cat-title">👥 Empleados</div>`;
 USERS.forEach(u=>h+=`<div class="item-row"><div>${u.emoji} ${u.name}</div><div class="small">${u.role}</div></div>`);
 return h;
}
function reprint(saleId){
 const sale=STATE.sales.find(s=>s.id===saleId);
 if(!sale) return;
 lastSale=sale; view="ventaFinal"; render();
}
async function updInv(k){
 STATE.inventory[k].stock=Number(document.getElementById("inv-"+k).value);
 await save();
}

boot();
</script>
</body>
</html>
